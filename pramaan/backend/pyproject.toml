[project]
name = "pramaan-backend"
version = "0.1.0"
description = "PRAMAAN — evidence reconciliation engine and API"
# The floor and ceiling are a range; `.python-version` beside this file pins the
# exact interpreter. Both are needed: the range says what the code supports, the
# pin says what the toolchain uses. Without the pin `uv` picked 3.12 on a clean
# machine while `[tool.mypy] python_version` said 3.11 and the Dockerfile shipped
# `python:3.11-slim`, so numpy's stubs used syntax mypy was told to reject — a
# failure that could only appear away from a developer's existing venv.
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "pystac-client>=0.8",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "geopandas>=1.0",
    "weasyprint>=62.0",
    # MinIO is S3-compatible, so the standard S3 client is the boring choice and
    # the one a deployment can repoint at any object store. `boto3-stubs` is a
    # runtime dependency rather than a dev one because
    # `app/services/ingestion/store.py` imports the S3Client type under
    # TYPE_CHECKING and `mypy --strict` runs over `app/api`, which reaches it.
    "boto3>=1.35",
    "boto3-stubs[s3]>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "testcontainers[postgres]>=4.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "app.services.reconcile.*"
disallow_any_expr = false
strict = true

# Celery ships no type information (no py.typed, no stubs on PyPI). Two
# consequences, both upstream rather than ours, scoped as narrowly as possible
# so nothing else loses strictness:
#
#   1. importing celery is an `import-untyped` error;
#   2. `@celery_app.task` is therefore an untyped decorator, which under
#      --strict makes every task it wraps "untyped" too.
#
# Task bodies stay fully checked: only the decorator is exempted, and only in
# app.workers. A task taking an untyped argument would still fail.
[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.workers.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
