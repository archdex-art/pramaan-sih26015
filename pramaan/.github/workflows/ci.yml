name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check app ../scripts

      - name: Format check
        run: uv run ruff format --check app ../scripts

      # The engine is the only module under --strict. It is a pure function and
      # government evidence depends on it; there is no excuse for Any here.
      - name: Type-check reconciliation engine (strict)
        run: uv run mypy app/services/reconcile app/services/terrain app/services/photo app/services/satellite app/services/temporal app/services/context app/services/audit app/db app/workers app/api --strict

      - name: Engine purity (no IO, no clock, no RNG)
        run: uv run pytest ../tests/unit/test_engine_purity.py -q

      - name: Engine property invariants (I1-I5)
        run: uv run pytest ../tests/unit/test_engine_properties.py -q

      # ★ The demo's insurance policy. Nothing merges without this green.
      - name: GOLDEN CASE SUITE (GT-3)
        run: uv run pytest ../tests/golden -q

      # 100% branch coverage is required on the deterministic core only: the
      # engine and the pure producers (terrain rules, detectability gate).
      # These are the modules with no IO, so full coverage is achievable
      # without mocking, and they are the modules whose bugs become government
      # evidence. IO-bound producers (satellite, ingestion) get behavioural
      # tests instead — demanding 100% there would buy mocks, not correctness.
      #
      # `app.services.audit.ledger` is gated by the `database` job below, not
      # here: its write path cannot execute without a server, so demanding
      # 100% of it from this job would only be satisfiable by pragmas.
      - name: Tests + deterministic-core coverage gate
        run: >
          uv run pytest ../tests -q
          --cov=app.services.reconcile
          --cov=app.services.terrain
          --cov=app.services.photo
          --cov=app.services.satellite
          --cov=app.services.temporal
          --cov=app.services.context
          --cov=app.services.audit.persistence
          --cov=app.services.audit.reproducibility
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100

      - name: Worked examples in the design doc are reproducible
        run: uv run python ../scripts/render_worked_examples.py --check

  database:
    # The reproducibility guarantee (docs §21.3) is a claim about stored rows,
    # so it has to be tested against a real database. NUMERIC(5,4) rounds, JSONB
    # reorders keys, and a partitioned insert missing its key lands in DEFAULT
    # without complaint — none of which an in-process test can observe.
    # Blocking: this proves /recompute, which is the audit-defensibility demo.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d t"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Apply every migration from scratch
        working-directory: db
        env:
          DATABASE_URL: postgresql+psycopg://postgres:t@127.0.0.1:5432/t
        run: uv run --with 'psycopg[binary]' --with alembic alembic upgrade head

      # Asserted separately from the tests below: a migration chain that only
      # works forwards is not reversible, and an irreversible migration cannot
      # be shipped to a district deployment.
      - name: Migrations are reversible
        working-directory: db
        env:
          DATABASE_URL: postgresql+psycopg://postgres:t@127.0.0.1:5432/t
        run: |
          uv run --with 'psycopg[binary]' --with alembic alembic downgrade base
          uv run --with 'psycopg[binary]' --with alembic alembic upgrade head

      # The whole suite, not just tests/integration: with a database present the
      # ledger's write path is reachable, so this is the only job that can gate
      # `app.services.audit` at 100% honestly.
      - name: Full suite + ledger coverage gate through real PostGIS
        working-directory: backend
        env:
          PRAMAAN_TEST_DSN: host=127.0.0.1 port=5432 user=postgres password=t dbname=t
        run: >
          uv run --with 'psycopg[binary]' pytest ../tests -q
          --cov=app.services.audit
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100

      # The offline sibling of GET /api/v1/ledger/verify. An auditor must be
      # able to check chain integrity from psql without the application, so the
      # script that does it has to keep working — it was previously wired into
      # neither CI nor the Makefile, which is how such a script quietly rots.
      - name: The ledger chain verifier still runs
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:t@127.0.0.1:5432/t
        run: uv run --with 'psycopg[binary]' python ../scripts/verify_ledger_chain.py

  frontend:
    # Typecheck only. The chart is verified by driving it in a browser, which is
    # the right proof for a visual claim; a snapshot test would pin pixels and
    # break on every legitimate design change without checking readability.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run build

  vocabulary-lint:
    # W6 fix (docs §37): the system must never emit accusatory language.
    # Enforced as a CI rule, not a style guideline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run --with pyyaml python scripts/vocabulary_lint.py

  endpoints:
    # Non-blocking by design: a government endpoint being down is a finding to
    # record in docs/09-data-sources.md, not a broken commit.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run --with httpx python scripts/verify_endpoints.py
