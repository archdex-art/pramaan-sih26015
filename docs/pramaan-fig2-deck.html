<!doctype html>
<html lang="en" data-theme="light">
<meta charset="utf-8">
<title>PRAMAAN — reconciliation mechanism (deck figure)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">

<!--
  Deck derivative of Figure 2 in pramaan-architecture.html.

  Sized for the 7.2 x 4.05 in picture box on slide 3 of the SIH idea deck.
  Legibility budget: the PNG is placed at 7.2 in on a 13.33 in slide, so a judge
  reading the PDF fit-to-window on a laptop (~105 px/in) sees it at 756 px, i.e.
  0.525 x these SVG units. Smallest type here is 22 px -> 11.5 px on screen,
  which is the floor for comfortable reading. Nothing below 22 px belongs here.

  Weights are the engine's, not a redraw of the poster:
  backend/app/services/reconcile/weights.py DEFAULT_WEIGHTS.
-->

<style>
  :root {
    --surface:  #FFFFFF;
    --sunk:     #E7EDE9;
    --ink:      #10201B;
    --muted:    #55665D;
    --faint:    #83958B;
    --line:     #C4D0C8;
    --hair:     #DDE5DF;
    --amber:    #9E5C13;
    --clay:     #92321F;
    --moss:     #6E8E7B;
    --f-body:   "Public Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --f-mono:   "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  html, body { margin: 0; padding: 0; background: var(--surface); }
  svg { display: block; width: 1440px; height: 810px; }

  .s-lane  { font-family: var(--f-mono); font-size: 22px; font-weight: 600; letter-spacing: 0.15em; fill: var(--faint); }
  .s-hdr   { font-family: var(--f-mono); font-size: 22px; font-weight: 500; letter-spacing: 0.06em; fill: var(--faint); }
  .s-box   { font-family: var(--f-body); font-size: 32px; font-weight: 600; fill: var(--ink); }
  .s-chip  { font-family: var(--f-body); font-size: 30px; font-weight: 600; fill: var(--ink); }
  .s-sub   { font-family: var(--f-mono); font-size: 24px; fill: var(--muted); }
  .s-chsub { font-family: var(--f-mono); font-size: 22px; fill: var(--muted); }
  .s-wt    { font-family: var(--f-mono); font-size: 28px; font-weight: 600; fill: var(--ink); }
  .s-edge  { font-family: var(--f-mono); font-size: 24px; fill: var(--muted); }
  .s-tag   { font-family: var(--f-mono); font-size: 22px; font-weight: 600; letter-spacing: 0.06em; }
  .s-note  { font-family: var(--f-body); font-size: 24px; font-style: italic; fill: var(--faint); }

  .node    { fill: var(--sunk); stroke: var(--line); stroke-width: 2; }
  .chip    { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
  .edge    { stroke: var(--moss); stroke-width: 2.6; fill: none; }
  .edge-a  { stroke: var(--amber); stroke-width: 2.6; fill: none; }
  .edge-c  { stroke: var(--clay); stroke-width: 2.6; fill: none; }
  .rule    { stroke: var(--hair); stroke-width: 2; }
</style>

<svg viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The reconciliation mechanism. A geo-coded claim passes a detectability gate that
     compares the claimed structure's footprint against the 900 square metre area of one 30 metre
     pixel, then fans out to six evidence families: terrain 0.25, satellite 0.20, temporal 0.20,
     matched controls 0.15, context 0.08 and photo 0.12. Five are independent of the claim; the
     photograph is the claim's own source and is weighted lowest. When the gate fails, per-structure
     satellite evidence is disabled and the claim is escalated to a cluster claim. The weighted
     aggregate yields a score, confidence and coverage, an L0 to L4 epistemic level with inconclusive
     as the default and causal level 5 unreachable in code, and a verdict that stays provisional
     until a named officer adjudicates it into an append-only hash-chained ledger.">

  <defs>
    <marker id="a-moss" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,0 10,4 0,8" fill="#6E8E7B"/>
    </marker>
    <marker id="a-clay" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,0 10,4 0,8" fill="#92321F"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,0 10,4 0,8" fill="#9E5C13"/>
    </marker>
  </defs>

  <!-- ================= lane headers ================= -->
  <text class="s-lane" x="20"  y="34">CLAIM</text>
  <text class="s-lane" x="430" y="34">GATE</text>
  <text class="s-lane" x="590" y="34">SIX EVIDENCE FAMILIES</text>
  <line class="rule" x1="20" y1="48" x2="1420" y2="48"/>

  <!-- ================= claim ================= -->
  <rect class="node" x="20" y="165" width="320" height="195" rx="4"/>
  <text class="s-box" x="44" y="212">Geo-coded claim</text>
  <text class="s-sub" x="44" y="258">type · status · date</text>
  <text class="s-sub" x="44" y="292">lat/lon · accuracy</text>
  <text class="s-sub" x="44" y="326">unique_id</text>

  <line class="edge" x1="340" y1="262" x2="362" y2="262" marker-end="url(#a-moss)"/>

  <!-- ================= detectability gate ================= -->
  <text class="s-edge" x="545" y="150" text-anchor="end" fill="#9E5C13">footprint vs 900 m² pixel</text>
  <polygon points="455,187 545,262 455,337 365,262" fill="none" stroke="#9E5C13" stroke-width="3"/>
  <text class="s-tag" x="455" y="255" text-anchor="middle" fill="#9E5C13">DETECT-</text>
  <text class="s-tag" x="455" y="281" text-anchor="middle" fill="#9E5C13">ABILITY</text>

  <line class="edge-a" x1="545" y1="262" x2="584" y2="262" marker-end="url(#a-amber)"/>

  <!-- gate failure branch -->
  <polyline class="edge-c" points="455,337 455,470 584,470" marker-end="url(#a-clay)"/>
  <text class="s-edge" x="578" y="402" text-anchor="end" fill="#92321F">below limit</text>

  <!-- ================= six families ================= -->
  <rect class="node" x="590" y="60" width="810" height="350" rx="4"/>
  <text class="s-hdr" x="612" y="104">FIVE INDEPENDENT · PHOTO IS THE CLAIM’S OWN SOURCE</text>

  <!-- row 1 -->
  <rect class="chip" x="612" y="130" width="380" height="80" rx="3"/>
  <text class="s-chip"  x="634" y="164">Terrain</text>
  <text class="s-chsub" x="634" y="194">flow accumulation · slope</text>
  <text class="s-wt"    x="970" y="164" text-anchor="end">0.25</text>

  <rect class="chip" x="1010" y="130" width="380" height="80" rx="3"/>
  <text class="s-chip"  x="1032" y="164">Satellite</text>
  <text class="s-chsub" x="1032" y="194">NDVI · MNDWI</text>
  <text class="s-wt"    x="1368" y="164" text-anchor="end">0.20</text>
  <text class="s-tag"   x="1368" y="194" text-anchor="end" fill="#9E5C13">GATED</text>

  <!-- row 2 -->
  <rect class="chip" x="612" y="222" width="380" height="80" rx="3"/>
  <text class="s-chip"  x="634" y="256">Temporal</text>
  <text class="s-chsub" x="634" y="286">same season only</text>
  <text class="s-wt"    x="970" y="256" text-anchor="end">0.20</text>
  <text class="s-tag"   x="970" y="286" text-anchor="end" fill="#9E5C13">GATED</text>

  <rect class="chip" x="1010" y="222" width="380" height="80" rx="3"/>
  <text class="s-chip"  x="1032" y="256">Matched controls</text>
  <text class="s-chsub" x="1032" y="286">5–12 untreated sites</text>
  <text class="s-wt"    x="1368" y="256" text-anchor="end">0.15</text>

  <!-- row 3 -->
  <rect class="chip" x="612" y="314" width="380" height="80" rx="3"/>
  <text class="s-chip"  x="634" y="348">Context</text>
  <text class="s-chsub" x="634" y="378">rainfall · land cover</text>
  <text class="s-wt"    x="970" y="348" text-anchor="end">0.08</text>

  <rect class="chip" x="1010" y="314" width="380" height="80" rx="3"
        stroke="#83958B" stroke-dasharray="9 7"/>
  <text class="s-chip"  x="1032" y="348">Photo</text>
  <text class="s-chsub" x="1032" y="378" fill="#92321F">the claim’s own source</text>
  <text class="s-wt"    x="1368" y="348" text-anchor="end">0.12</text>

  <!-- ================= cluster escalation ================= -->
  <rect x="590" y="430" width="810" height="110" rx="4"
        fill="#FAEDE9" stroke="#92321F" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text class="s-box" x="612" y="474">Cluster claim</text>
  <text class="s-sub" x="612" y="512">per-structure satellite evidence disabled</text>
  <text class="s-tag" x="1378" y="474" text-anchor="end" fill="#92321F">GATE FAILED</text>

  <!-- ================= wrap into aggregation ================= -->
  <polyline class="edge" points="1400,240 1420,240 1420,560 360,560 360,586" marker-end="url(#a-moss)"/>
  <polyline class="edge-c" points="700,540 700,560"/>

  <!-- ================= weighted aggregate ================= -->
  <rect x="20" y="590" width="680" height="185" rx="4"
        fill="#FBF2E5" stroke="#9E5C13" stroke-width="3"/>
  <text class="s-box" x="44" y="638">Weighted aggregate</text>
  <text class="s-sub" x="44" y="680">score · confidence · coverage</text>
  <text class="s-sub" x="44" y="712">N1 inconclusive is the default</text>
  <text class="s-sub" x="44" y="744" fill="#92321F">L0 → L4 · L5 causal unreachable</text>

  <line class="edge-a" x1="702" y1="660" x2="736" y2="660" marker-end="url(#a-amber)"/>

  <!-- ================= adjudication ================= -->
  <rect class="node" x="740" y="590" width="680" height="185" rx="4"/>
  <text class="s-box" x="764" y="638">Verdict → officer adjudicates</text>
  <text class="s-sub" x="764" y="680">dissent panel always shown</text>
  <text class="s-sub" x="764" y="712">scene ids · model versions · weights</text>
  <text class="s-tag" x="764" y="748" fill="#92321F">PROVISIONAL UNTIL SIGNED · HASH-CHAINED</text>

  <!-- ================= footnote ================= -->
  <text class="s-note" x="20" y="802">Terrain, satellite indices and temporal statistics are deterministic — no machine learning in three of the six families.</text>
</svg>
</html>
